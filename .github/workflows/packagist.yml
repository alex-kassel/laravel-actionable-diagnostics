name: Update Packagist & Test Suite

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  tests:
    name: Run PHPUnit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          tools: composer

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Run Test Suite
        run: vendor/bin/phpunit

  update-packagist:
    name: Trigger Packagist Update
    needs: tests
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Packagist API
        run: |
          curl -XPOST -H'Content-Type: application/json' \
            'https://packagist.org/api/update-package?username=alex-kassel&apiToken=${{ secrets.PACKAGIST_TOKEN }}' \
            -d '{"repository":{"url":"https://github.com/alex-kassel/laravel-actionable-diagnostics"}}'
